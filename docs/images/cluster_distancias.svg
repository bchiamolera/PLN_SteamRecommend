<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Extremos da distância entre centroides dos clusters</title>
  <desc id="desc">Comparação do par de clusters mais próximo e do par mais distante por distância cosseno.</desc>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Distância intercluster entre centroides</text>
  <text x="480" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526079">Distância cosseno: 0 indica centroides idênticos; valores maiores indicam maior separação</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="100" width="400" height="250" rx="14" fill="#f5f7fb" stroke="#ccd3df"/>
    <text x="255" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Par mais próximo</text>
    <circle cx="155" cy="210" r="53" fill="#6e91ea"/><circle cx="355" cy="210" r="53" fill="#739fe8"/>
    <text x="155" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">C1</text><text x="355" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">C5</text>
    <line x1="208" y1="210" x2="302" y2="210" stroke="#d7665a" stroke-width="8"/>
    <text x="255" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#b1453d">0,350</text>
    <text x="255" y="293" text-anchor="middle" font-size="14" fill="#526079">aventura/mundo geral ↔ ação/combate</text>
    <text x="255" y="318" text-anchor="middle" font-size="13" fill="#667085">fronteira temática relativamente difusa</text>
    <rect x="505" y="100" width="400" height="250" rx="14" fill="#f5f7fb" stroke="#ccd3df"/>
    <text x="705" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Par mais distante</text>
    <circle cx="580" cy="210" r="53" fill="#2c9c69"/><circle cx="830" cy="210" r="53" fill="#9d62c7"/>
    <text x="580" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">C8</text><text x="830" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">C9</text>
    <line x1="633" y1="210" x2="777" y2="210" stroke="#2c9c69" stroke-width="8" stroke-dasharray="13 8"/>
    <text x="705" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#237d55">0,902</text>
    <text x="705" y="293" text-anchor="middle" font-size="14" fill="#526079">ação rápida/shooter ↔ visual novel/romance</text>
    <text x="705" y="318" text-anchor="middle" font-size="13" fill="#667085">separação temática forte e interpretável</text>
  </g>
  <text x="480" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#667085">Fonte: saídas do notebook PLN_AnaliseClusters.ipynb</text>
</svg>
